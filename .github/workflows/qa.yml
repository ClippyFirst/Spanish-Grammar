name: QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Run full QA
        run: npm run qa
        env:
          PUBLIC_BASE: /Spanish-Grammar
          SITE_URL: https://clippyfirst.github.io/Spanish-Grammar
